<!DOCTYPE html>
<!--
  =============================================================
  HOME PAGE  (index.html)
  =============================================================
  This is the front page of your portfolio, built to match your
  Figma wireframe:

    • a light / dark mode toggle (top-left)
    • your name, big and centred (top)
    • an "about me" circle (top-right)
    • one large project in the middle
    • a row of link buttons along the bottom

  Anywhere you see the word REPLACE, that is content for YOU
  to change. Don't leave any REPLACE text in your final site!
  =============================================================
-->
<html lang="en-NZ">
<head>
  <meta charset="UTF-8" />
  <!-- This meta tag is what makes the site work on phones. Leave it in. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- REPLACE: the browser tab title -->
  <title>Phoebe — Portfolio</title>

  <!-- REPLACE: a one-line description search engines show -->
  <meta name="description" content="Portfolio of Phoebe, a design student at Te Herenga Waka." />

  <!-- The little icon in the browser tab. Replace assets/favicon.svg with your own. -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Skip link: lets keyboard users jump straight to the main content
       instead of tabbing through the menu. It's hidden until focused. -->
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ===================== TOP BAR ===================== -->
  <!-- Three things across the top: the theme toggle, your name, the about circle. -->
  <header class="topbar container">
    <!-- Light / dark mode button. script.js makes it work and remembers your choice. -->
    <button class="theme-toggle" aria-pressed="false" aria-label="Switch to dark mode">
      <span class="theme-toggle__label">Light / dark mode</span>
    </button>

    <!-- REPLACE: your name -->
    <h1 class="brand">Phoebe</h1>

    <!-- The "about me" circle links down to the about section. -->
    <a class="about-circle" href="#about">about me</a>
  </header>

  <main id="main" class="container">

    <!-- ===================== FEATURED PROJECT (required) ===================== -->
    <!-- The big project in the middle. It links to its own page (project.html). -->
    <section class="featured">
      <a class="feature-card" href="project.html">
        <!-- REPLACE the placeholder image with a picture of your project. -->
        <img src="assets/project-placeholder-1.svg" alt="REPLACE: describe this project image" />
        <span class="feature-card__label">project</span>
      </a>
    </section>

    <!-- ===================== LINK BUTTONS ===================== -->
    <!--
      A row of four link buttons, like your wireframe. Point each one
      wherever you like — more projects, an email, Instagram, a CV...
      Ask Claude "make the first link button go to my Instagram" and
      it'll sort out the address and the label.
    -->
    <nav class="link-row" aria-label="Quick links">
      <a class="link-button" href="#">REPLACE: Link button</a>
      <a class="link-button" href="#">REPLACE: Link button</a>
      <a class="link-button" href="#">REPLACE: Link button</a>
      <a class="link-button" href="#">REPLACE: Link button</a>
    </nav>

    <!-- ===================== ABOUT ME (required) ===================== -->
    <!-- The about circle at the top jumps down to here. -->
    <section id="about" class="about-section">
      <h2 class="about-section__title">About me</h2>
      <div class="about">
        <!-- REPLACE the placeholder image, or ask Claude to swap in your own photo. -->
        <img
          class="about__photo"
          src="assets/profile-placeholder.svg"
          alt="REPLACE: a photo of you"
        />
        <div class="about__text">
          <!-- REPLACE: 2-4 sentences about you. Who are you? What are you
               studying? What kind of design do you care about? -->
          <p>
            This is my update to this paragraph!!!! !
          </p>
        </div>
      </div>
    </section>

  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="site-footer">
    <div class="container">
      <!-- The year fills in automatically (see script.js). -->
      <p>© <span id="year"></span> Phoebe</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
